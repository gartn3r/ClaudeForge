name: CI

# Runs only by hand, from the Actions tab (Run workflow), to keep within the Actions budget: pushes
# to main and pull requests no longer start it. Run the checks locally with `npm run typecheck`,
# `npm run lint`, `npm run check:locales` and `npm test`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checks and tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the Electron runtime
        run: node -e "require('electron')"

      - name: Translation files
        run: npm run check:locales

      - name: Third-party notices are up to date
        run: npm run notices:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Seam 1 (backend API, Vitest)
        run: npm run test:seam1

      - name: Seam 2 (Playwright for Electron)
        run: npm run test:seam2

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  package:
    name: Installer, installed and updated (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Never signed here: the signing secrets are for the release workflow only.
      - name: Package the installer
        run: npm run package

      - name: Package a later version for the installed app to update to
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Move-Item dist dist-current
          npm version patch --no-git-tag-version
          npx electron-builder --config electron-builder.config.mjs --win --publish never
          Move-Item dist dist-next

      - name: Install it on this fresh machine, as a user would
        shell: pwsh
        run: |
          $installer = Get-Item dist-current/ClaudeForge-Setup-*.exe
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\claudeforge\ClaudeForge.exe'
          if (-not (Test-Path $exe)) { throw "The installer did not install ClaudeForge at $exe" }
          "CLAUDEFORGE_EXECUTABLE=$exe" >> $env:GITHUB_ENV

      - name: Journeys against the installed app
        run: npm run test:packaged
        env:
          CLAUDEFORGE_UPDATE_RELEASE: ${{ github.workspace }}\dist-next

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist-current/ClaudeForge-Setup-*.exe
          retention-days: 7

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
